[workspace]
resolver = "2"
members = ["crates/openhsm-signer", "crates/openhsm-hw", "crates/openhsm-node", "crates/openhsm-cli"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"
repository = "https://github.com/mouse-trap-1/openHSM"

[workspace.dependencies]
k256 = { version = "0.14", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
sha2 = "0.11"
sha3 = "0.10"
ripemd = "0.1"
hmac = "0.12"
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
overflow-checks = true
panic = "abort"
lto = "thin"
codegen-units = 4
strip = "symbols"

[profile.dev]
opt-level = 1
